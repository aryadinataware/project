<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ukur Error kWH Meter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; }
    .result-error.positive { color: green; }
    .result-error.negative { color: red; }
    #secondukurerror, #persenukurerror {
      font-size: 30px;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="mb-1">Ukur Error kWH Meter</h3>
    <p class="text-muted">by Agus Haryadi</p>

    <div class="row mb-3">
      <div class="col-md-2">
        <label class="form-label">CosΦ</label>
        <input id="cospiukurerror" type="number" step="0.01" class="form-control" value="0.85">
      </div>
      <div class="col-md-2">
        <label class="form-label">N (Putaran)</label>
        <input id="nukurerror" type="number" class="form-control" value="5">
      </div>
      <div class="col-md-2">
        <label class="form-label">V (Volt)</label>
        <input id="tegukurerror" type="number" class="form-control" value="220">
      </div>
      <div class="col-md-3">
        <label class="form-label">Kons (Konstanta)</label>
        <input id="konsukurerror" type="number" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">Arus (Ampere)</label>
        <input id="arusukurerror" type="number" class="form-control">
      </div>
    </div>

    <div class="row align-items-center mb-4 justify-content-center text-center">
      <div class="col-auto">
        <span id="secondukurerror">0.0</span><span class="ms-1">s</span>
      </div>
      <div class="col-auto">
        <button id="buttonstarttimer" class="btn btn-success btn-lg mx-2" onclick="starttimer()">Start</button>
        <button id="buttonstoptimer" class="btn btn-danger btn-lg mx-2" onclick="stoptimer()" style="display:none;">Stop</button>
      </div>
      <div class="col-auto">
        <span id="persenukurerror">–</span><span class="ms-1">%</span>
      </div>
    </div>

    <input type="hidden" id="xerrkwh">
  </div>

  <script>
    let startTime, interval, errorkwh;

    function starttimer() {
      document.getElementById('buttonstarttimer').style.display = 'none';
      document.getElementById('buttonstoptimer').style.display = 'inline-block';
      startTime = Date.now();
      interval = setInterval(() => {
        const detik = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById('secondukurerror').textContent = detik;
      }, 100);
    }

    function stoptimer() {
      clearInterval(interval);
      document.getElementById('buttonstoptimer').style.display = 'none';
      document.getElementById('buttonstarttimer').style.display = 'inline-block';

      const N = +document.getElementById('nukurerror').value;
      const cosphi = +document.getElementById('cospiukurerror').value;
      const V = +document.getElementById('tegukurerror').value;
      const kons = +document.getElementById('konsukurerror').value;
      const arus = +document.getElementById('arusukurerror').value;
      const t = (Date.now() - startTime) / 1000;

      if (!N || !cosphi || !V || !kons || !arus || !t) {
        alert("Harap isi semua nilai dengan benar sebelum menghitung.");
        return;
      }

      errorkwh = (((N * 3600 * 1000) / (V * arus * cosphi * kons) - t) / t * 100).toFixed(2);
      const persenEl = document.getElementById('persenukurerror');
      persenEl.textContent = errorkwh;
      persenEl.classList.remove('positive', 'negative');
      persenEl.classList.add(errorkwh < 5 ? 'positive' : 'negative');

      document.getElementById('xerrkwh').value = errorkwh;
    }
  </script>
</body>
</html>
